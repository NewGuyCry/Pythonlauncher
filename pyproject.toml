[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "block-launcher"
version = "0.1.0"
description = "A lightweight Minecraft Java launcher written in Python"
requires-python = ">=3.10"
dependencies = ["pywebview>=5.0"]

[project.scripts]
block-launcher = "mc_launcher.app:main"

[tool.setuptools]
packages = ["mc_launcher"]
